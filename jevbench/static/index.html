<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jev bench</title>
<style>
  :root {
    color-scheme: dark;
    --bg:#0f1116; --panel:#181c24; --line:#2a303c; --fg:#e8ebf1; --dim:#8d95a6;
    --good:#7ee08a; --warn:#f2c14e; --bad:#ff7b7b; --accent:#7fb2ff;
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:20px 16px 40px; background:var(--bg); color:var(--fg);
         font:14px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; }
  h1 { font-size:17px; margin:0 0 4px; }
  .sub { color:var(--dim); font-size:12px; margin:0 0 18px; }

  form { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; margin-bottom:18px; }
  label { display:flex; flex-direction:column; gap:4px; font-size:11px; color:var(--dim); }
  input, select, button { background:var(--panel); color:var(--fg); border:1px solid var(--line);
                          border-radius:6px; padding:6px 10px; font:inherit; }
  button { cursor:pointer; border-color:var(--accent); }
  button:disabled { opacity:.45; cursor:default; border-color:var(--line); }

  /* 左右比較。2 枚が必ず横並びになるようにする。 */
  .versus { display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start; }
  @media (max-width: 860px) { .versus { grid-template-columns:1fr; } }

  .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .panel.lead { border-color:var(--good); }
  .panel h2 { font-size:15px; margin:0 0 2px; display:flex; justify-content:space-between; align-items:baseline; }
  .tag { font-size:10px; color:var(--dim); font-weight:normal; }
  .tag.lead { color:var(--good); }

  .headline { display:flex; gap:16px; align-items:baseline; margin:6px 0 10px; }
  .headline b { font-size:26px; line-height:1; }
  .headline span { font-size:11px; color:var(--dim); }

  .timer { height:6px; background:#222836; border-radius:3px; overflow:hidden; margin-bottom:10px; }
  .timer i { display:block; height:100%; background:var(--good); transition:width .2s linear; }

  /* ズーキーパーの盤面: 丸アイコンを敷き詰める */
  .zoo { display:grid; grid-template-columns:repeat(8, 1fr); gap:3px; margin-bottom:10px; }
  .zoo .cell { aspect-ratio:1; border-radius:50%; background:#232936;
               display:flex; align-items:center; justify-content:center; }
  .zoo .cell img { width:78%; height:78%; display:block; }

  /* テトリスなど文字の盤面 */
  .text-board { line-height:1.05; letter-spacing:2px; white-space:pre; font-size:15px; margin-bottom:10px; }
  .text-board .empty { color:#262c38; }

  .quota { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .quota .q { display:flex; align-items:center; gap:3px; font-size:11px;
              background:#212734; border-radius:20px; padding:2px 7px 2px 3px; color:var(--dim); }
  .quota .q img { width:16px; height:16px; }
  .quota .q.done { color:var(--good); }

  dl { display:grid; grid-template-columns:auto auto; gap:1px 12px; margin:0; font-size:12px; }
  dt { color:var(--dim); } dd { margin:0; text-align:right; }
  dd.money { color:var(--good); }
  dd.bad { color:var(--bad); }
  .err { color:var(--bad); font-size:11px; margin-top:8px; word-break:break-all; }
</style>
</head>
<body>
<h1>jev bench — System One vs LLM</h1>
<p class="sub">同じ seed・同じ局面・同じ候補手。違うのは「どれが最善か」を誰に聞くかだけ。</p>

<form id="controls">
  <label>game <select id="game"></select></label>
  <label>left <select id="agentA"></select></label>
  <label>right <select id="agentB"></select></label>
  <label>seed <input id="seed" type="number" value="0" style="width:70px"></label>
  <label>goal <input id="goal" type="number" placeholder="既定" style="width:70px"></label>
  <label>step delay (ms) <input id="delay" type="number" value="0" style="width:90px"></label>
  <button id="start" type="submit">start</button>
</form>

<div class="versus" id="versus"></div>

<script>
const ANIMALS = ["elephant","giraffe","crocodile","panda","hippo","monkey","lion"];
const ICON = Object.fromEntries(ANIMALS.map(a => [a, `/static/animals/${a}.svg`]));
let CODE_TO_ANIMAL = {};

const versus = document.getElementById("versus");
const panels = new Map();

function panel(agent) {
  if (panels.has(agent)) return panels.get(agent);
  const el = document.createElement("div");
  el.className = "panel";
  el.innerHTML = `
    <h2>${agent}<span class="tag"></span></h2>
    <div class="headline"><b data-k="progress">0</b><span data-k="goal-label">progress</span>
      <b data-k="score" style="font-size:16px"></b><span data-k="score-label"></span></div>
    <div class="timer"><i data-k="timer-bar" style="width:100%"></i></div>
    <div data-k="board"></div>
    <div class="quota" data-k="quota"></div>
    <dl>
      <dt>turns</dt><dd data-k="turns">0</dd>
      <dt>latency (median)</dt><dd data-k="latency">–</dd>
      <dt>tokens in / out</dt><dd data-k="tokens">0 / 0</dd>
      <dt>cost (USD)</dt><dd class="money" data-k="cost">$0.000000</dd>
      <dt>agreement</dt><dd data-k="agreement">–</dd>
      <dt>fallbacks</dt><dd data-k="fallbacks">0</dd>
    </dl>
    <div class="err" data-k="err"></div>`;
  versus.appendChild(el);
  const p = {
    el,
    q: k => el.querySelector(`[data-k="${k}"]`),
    set(k, v) { const n = this.q(k); if (n) n.textContent = v; },
    latencies: [], fallbacks: 0, progress: 0,
  };
  panels.set(agent, p);
  return p;
}

function renderZoo(rows) {
  const cells = rows.flatMap(row => [...row].map(ch => {
    const animal = CODE_TO_ANIMAL[ch];
    return animal
      ? `<div class="cell"><img src="${ICON[animal]}" alt="${animal}"></div>`
      : `<div class="cell"></div>`;
  }));
  return `<div class="zoo">${cells.join("")}</div>`;
}

function renderText(rows) {
  const body = rows.map(row =>
    [...row].map(c => c === "." ? '<span class="empty">.</span>' : c).join("")
  ).join("\n");
  return `<div class="text-board">${body}</div>`;
}

function renderQuota(hud) {
  if (hud.kind !== "zookeeper") return "";
  return ANIMALS.map(a => {
    const got = hud.caught[a] ?? 0;
    const done = got >= hud.quota;
    return `<span class="q ${done ? "done" : ""}"><img src="${ICON[a]}" alt="${a}">${got}/${hud.quota}</span>`;
  }).join("");
}

function median(xs) {
  if (!xs.length) return 0;
  const s = [...xs].sort((a, b) => a - b);
  const m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
}

/** 進んでいる方の枠を緑にする。一目で分かるように。 */
function markLead() {
  const live = [...panels.values()];
  const best = Math.max(...live.map(p => p.progress));
  const tie = live.filter(p => p.progress === best).length > 1;
  for (const p of live) {
    const lead = !tie && p.progress === best && best > 0;
    p.el.classList.toggle("lead", lead);
    const tag = p.el.querySelector(".tag");
    tag.textContent = lead ? "lead" : "";
    tag.className = lead ? "tag lead" : "tag";
  }
}

async function loadOptions() {
  const { agents, games, animal_codes } = await (await fetch("/agents")).json();
  CODE_TO_ANIMAL = Object.fromEntries(Object.entries(animal_codes).map(([a, c]) => [c, a]));
  for (const [id, preset] of [["agentA", "jev"], ["agentB", "claude"]]) {
    document.getElementById(id).innerHTML =
      agents.map(a => `<option ${a === preset ? "selected" : ""}>${a}</option>`).join("");
  }
  document.getElementById("game").innerHTML = games.map(g => `<option>${g}</option>`).join("");
}

document.getElementById("controls").addEventListener("submit", ev => {
  ev.preventDefault();
  const button = document.getElementById("start");
  button.disabled = true;
  versus.innerHTML = "";
  panels.clear();

  // 同じものを左右に選ばれてもパネルは 1 枚（イベントはエージェント名で束ねている）。
  const agents = [...new Set(
    [document.getElementById("agentA").value, document.getElementById("agentB").value]
  )];
  agents.forEach(panel);

  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => ws.send(JSON.stringify({
    agents,
    game: document.getElementById("game").value,
    seed: Number(document.getElementById("seed").value),
    goal: Number(document.getElementById("goal").value) || null,
    step_delay_ms: Number(document.getElementById("delay").value),
  }));

  ws.onmessage = e => {
    const msg = JSON.parse(e.data);
    if (msg.type === "done") { button.disabled = false; ws.close(); return; }
    const p = panel(msg.agent);

    if (msg.type === "error") { p.set("err", msg.message); return; }

    if (msg.type === "turn") {
      const hud = msg.hud;
      p.q("board").innerHTML =
        hud.kind === "zookeeper" ? renderZoo(msg.board) : renderText(msg.board);
      p.q("quota").innerHTML = renderQuota(hud);

      p.progress = msg.progress;
      p.set("progress", msg.progress.toLocaleString());
      p.set("goal-label", msg.goal_label);
      if (hud.kind === "zookeeper") {
        p.set("score", hud.score.toLocaleString());
        p.set("score-label", "score");
        const pct = Math.max(0, Math.min(100, 100 * hud.timer / hud.timer_max));
        const bar = p.q("timer-bar");
        bar.style.width = `${pct}%`;
        bar.style.background = pct < 20 ? "var(--bad)" : pct < 45 ? "var(--warn)" : "var(--good)";
      }

      p.set("turns", msg.index + 1);
      p.latencies.push(msg.latency_ms);
      p.set("latency", `${Math.round(median(p.latencies))} ms`);
      p.set("tokens", `${msg.input_tokens.toLocaleString()} / ${msg.output_tokens.toLocaleString()}`);
      p.set("cost", `$${msg.cost_usd.toFixed(6)}`);
      if (msg.note.startsWith("fallback: ")) {
        p.fallbacks += 1;
        p.set("fallbacks", p.fallbacks);
        p.q("fallbacks").className = "bad";
        p.set("err", msg.note.slice("fallback: ".length));
      }
      markLead();
    }

    if (msg.type === "summary") {
      p.set("agreement", `${Math.round(msg.agreement * 100)} %`);
      p.set("cost", `$${msg.cost_usd.toFixed(6)}`);
      p.set("latency", `${Math.round(msg.median_latency_ms)} ms`);
      p.set("fallbacks", `${msg.fallbacks} / ${msg.turns}`);
      if (msg.fallbacks) {
        p.q("fallbacks").className = "bad";
        p.set("err", `API 未到達: ${msg.fallback_reason}`);
      }
    }
  };

  ws.onclose = () => { button.disabled = false; };
});

loadOptions();
</script>
</body>
</html>
