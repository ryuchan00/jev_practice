[project]
name = "jev-practice"
version = "0.1.0"
description = "Jev (TypeSafe System One) と Claude にテトリスを打たせて比べる練習台"
requires-python = ">=3.10"
dependencies = [
    "typesafe-sdk>=0.7.0",
    "anthropic>=0.40.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
jev-tetris = "jevtetris.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jevtetris"]
